<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筋トレ記録</title>
    <!-- Tailwind CSSをCDNで読み込む（ビルド不要でデザイン適用） -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabaseのライブラリを読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 p-4 max-w-md mx-auto font-sans">
    <h1 class="text-xl font-bold mb-4 text-center text-orange-400">⚡ 筋トレ記録</h1>

    <!-- 入力フォーム -->
    <form id="workout-form" class="bg-gray-900 p-4 rounded-2xl shadow-lg mb-6 space-y-4 border border-gray-800">
        <div>
            <label class="block text-xs text-gray-400 mb-1">日付</label>
            <input type="date" id="date" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white">
        </div>

        <div>
            <label class="block text-xs text-gray-400 mb-1">種目</label>
            <select id="exercise-select" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white">
                <option value="">種目を選んでください</option>
            </select>
        </div>

        <!-- 前回記録の表示エリア -->
        <div id="last-log-area" class="bg-gray-800/60 p-3 rounded-xl border border-gray-700 hidden">
            <p class="text-xs text-orange-400 font-semibold mb-2" id="last-date-title">💡 前回の記録</p>
            <div id="last-logs-list" class="space-y-1"></div>
        </div>

        <div class="grid grid-cols-3 gap-2">
            <div>
                <label class="block text-xs text-gray-400 mb-1">セット数</label>
                <!-- inputmode="numeric" と pattern="[0-9]*" を追加 -->
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="set-number" value="1" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-center">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">重量 (kg)</label>
                <input type="text" inputmode="numeric" id="weight" placeholder="80" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-center text-lg font-bold">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">回数 (reps)</label>
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="reps" placeholder="10" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-center text-lg font-bold">
            </div>
        </div>

        <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold p-3 rounded-xl transition shadow-lg">
            記録を保存する
        </button>
    </form>

    <h2 class="text-sm font-bold text-gray-400 mb-2">直近の履歴</h2>
    <div id="history-list" class="space-y-2"></div>

    <script>
        // --- ★あなたのSupabase情報をここに書き換える★ ---
        const SUPABASE_URL = 'https://heijdrtigydbeszyfoll.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_eoS3X-CVN9hStOFrEaRCHA_mC1TDeLX';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 今日を日付の初期値に
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        let exercisesData = [];

        // 初期データ読み込み
        async function init() {
            // 種目取得
            const { data: exData } = await _supabase.from('exercises').select('*').order('name');
            if (exData) {
                exercisesData = exData;
                const select = document.getElementById('exercise-select');
                exData.forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex.id;
                    opt.textContent = `${ex.name} (${ex.category})`;
                    select.appendChild(opt);
                });
            }
            fetchHistory();
        }

        // 種目変更時に前回の記録を取得
        document.getElementById('exercise-select').addEventListener('change', async (e) => {
            const exerciseId = e.target.value;
            const area = document.getElementById('last-log-area');
            const list = document.getElementById('last-logs-list');
            list.innerHTML = '';

            if (!exerciseId) {
                area.classList.add('hidden');
                return;
            }

            // 最新の日付を取得
            const { data: latestLog } = await _supabase
                .from('workout_logs')
                .select('date')
                .eq('exercise_id', exerciseId)
                .order('date', { ascending: false })
                .limit(1);

            if (latestLog && latestLog.length > 0) {
                const lastDate = latestLog[0].date;
                document.getElementById('last-date-title').textContent = `💡 前回の記録 (${lastDate})`;

                const { data: logs } = await _supabase
                    .from('workout_logs')
                    .select('*')
                    .eq('exercise_id', exerciseId)
                    .eq('date', lastDate)
                    .order('set_number', { ascending: true });

                if (logs && logs.length > 0) {
                    area.classList.remove('hidden');
                    document.getElementById('set-number').value = logs.length + 1;

                    logs.forEach(log => {
                        const div = document.createElement('div');
                        div.className = 'flex justify-between items-center text-sm bg-gray-900/50 p-2 rounded-lg';
                        div.innerHTML = `<span>${log.set_number}セット目: <strong>${log.weight}kg</strong> × ${log.reps}回</span>` +
                                        `<button type="button" onclick="copySet(${log.weight}, ${log.reps})" class="text-xs bg-orange-600 text-white px-2 py-1 rounded-md">コピー</button>`;
                        list.appendChild(div);
                    });
                }
            } else {
                area.classList.add('hidden');
                document.getElementById('set-number').value = 1;
            }
        });

        function copySet(w, r) {
            document.getElementById('weight').value = w;
            document.getElementById('reps').value = r;
        }

        // 保存処理
        document.getElementById('workout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const exercise_id = document.getElementById('exercise-select').value;
            const date = document.getElementById('date').value;
            const set_number = parseInt(document.getElementById('set-number').value);
            const weight = parseFloat(document.getElementById('weight').value);
            const reps = parseInt(document.getElementById('reps').value);

            if (!exercise_id || isNaN(weight) || isNaN(reps)) {
                alert('入力内容を確認してください');
                return;
            }

            const { error } = await _supabase.from('workout_logs').insert([{ exercise_id, date, set_number, weight, reps }]);

            if (error) {
                alert('保存失敗: ' + error.message);
            } else {
                alert('保存しました！');
                document.getElementById('set-number').value = set_number + 1;
                fetchHistory();
            }
        });

        // 履歴取得
        async function fetchHistory() {
            const { data } = await _supabase
                .from('workout_logs')
                .select('*, exercises(name)')
                .order('date', { ascending: false })
                .limit(20);

            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            if (data) {
                data.forEach(h => {
                    const div = document.createElement('div');
                    div.className = 'bg-gray-900 p-3 rounded-xl flex justify-between items-center border border-gray-800 text-sm';
                    div.innerHTML = `<div><span class="text-gray-400 text-xs mr-2">${h.date}</span><span class="font-bold text-white">${h.exercises?.name}</span></div>` +
                                    `<div class="text-orange-400 font-bold">${h.set_number}set: ${h.weight}kg × ${h.reps}回</div>`;
                    historyList.appendChild(div);
                });
            }
        }

        init();
    </script>
</body>
</html>
